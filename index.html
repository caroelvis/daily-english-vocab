<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="每日英語單字 — 閃卡與測驗，適合日常生活" />
  <title>每日英語單字 · Daily English Vocab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <header class="site-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">📚</span>
      <div>
        <h1>每日英語單字</h1>
        <p class="tagline">Daily English · 生活必備</p>
      </div>
    </div>
    <nav class="mode-nav" role="tablist" aria-label="學習模式">
      <button type="button" class="nav-btn active" data-mode="flashcard" role="tab" aria-selected="true">
        <span class="nav-emoji">🃏</span> 閃卡
      </button>
      <button type="button" class="nav-btn" data-mode="quiz" role="tab" aria-selected="false">
        <span class="nav-emoji">✅</span> 測驗
      </button>
    </nav>
  </header>

  <main>
    <!-- FLASHCARD -->
    <section id="flashcard-view" class="view active" aria-label="閃卡模式">
      <div class="panel controls-bar">
        <label class="toggle">
          <input type="checkbox" id="auto-speak" />
          <span>自動發音</span>
        </label>
        <span class="meta" id="voice-info" title="目前使用的語音">語音：偵測中…</span>
        <span class="meta" id="flash-meta">載入中…</span>
      </div>

      <article class="card flash-card" id="flash-card">
        <div class="card-glow"></div>
        <div class="image-wrap">
          <img id="flash-image" alt="" decoding="async" />
          <div class="emoji-fallback" id="flash-emoji" aria-hidden="true">📦</div>
          <span class="category-pill" id="flash-category">—</span>
        </div>
        <div class="word-block">
          <h2 class="en-word" id="flash-word">…</h2>
          <p class="zh-gloss" id="flash-zh">…</p>
        </div>
        <div class="card-actions">
          <button type="button" class="btn btn-speak" id="btn-speak" title="播放發音">
            <span class="btn-icon">🔊</span> 發音
          </button>
          <button type="button" class="btn btn-primary btn-next" id="btn-next-flash">
            下一個單字 <span aria-hidden="true">→</span>
          </button>
        </div>
      </article>

      <p class="hint">點「下一個單字」隨機抽詞 · 盡量避免連續重複</p>
    </section>

    <!-- QUIZ -->
    <section id="quiz-view" class="view" aria-label="測驗模式" hidden>
      <div class="panel quiz-progress-bar">
        <div class="progress-track">
          <div class="progress-fill" id="quiz-progress-fill"></div>
        </div>
        <div class="quiz-stats-inline">
          <span id="quiz-progress-text">第 0 / 100 題</span>
          <span class="sep">·</span>
          <span class="stat-ok" id="quiz-live-correct">✓ 0</span>
          <span class="stat-bad" id="quiz-live-wrong">✗ 0</span>
        </div>
      </div>

      <article class="card quiz-card" id="quiz-card">
        <p class="quiz-prompt">看圖選出正確的英文單字</p>
        <div class="image-wrap quiz-image-wrap">
          <img id="quiz-image" alt="測驗圖片" decoding="async" />
          <div class="emoji-fallback" id="quiz-emoji" aria-hidden="true">📦</div>
        </div>
        <div class="options" id="quiz-options" role="group" aria-label="選項"></div>
        <p class="try-hint" id="quiz-try-hint" hidden>再試一次！</p>
      </article>

      <!-- Results -->
      <article class="card results-card" id="results-card" hidden>
        <div class="results-hero">
          <span class="results-emoji" id="results-emoji">🎉</span>
          <h2>測驗完成！</h2>
          <p class="results-sub">共完成 100 題</p>
        </div>
        <div class="results-grid">
          <div class="result-box ok">
            <span class="result-num" id="results-correct">0</span>
            <span class="result-label">答對</span>
          </div>
          <div class="result-box bad">
            <span class="result-num" id="results-wrong">0</span>
            <span class="result-label">答錯（兩次錯誤）</span>
          </div>
        </div>
        <p class="accuracy" id="results-accuracy">正確率 —</p>
        <button type="button" class="btn btn-primary btn-wide" id="btn-restart-quiz">
          重新開始測驗
        </button>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>純靜態網站 · 可離線開啟（圖片需網路）· speechSynthesis 發音</p>
  </footer>

  <div id="toast" class="toast" hidden role="status"></div>

  <script src="data/words.js"></script>
  <!-- Analytics API (Render). Override locally with localStorage vocab_analytics_api if needed. -->
  <script>window.VOCAB_ANALYTICS_API = 'https://daily-english-vocab-api.onrender.com';</script>
  <script src="js/app.js" defer></script>
</body>
</html>
